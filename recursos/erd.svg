  <rect x="219" y="361" width="118" height="15" rx="8" fill="#0F6E56"/>
  <rect x="219" y="368" width="118" height="8"  fill="#0F6E56"/>
  <text class="lbl" x="278" y="370">alumnos</text>
  <text class="sub" x="278" y="387">4 campos</text>
</g>

<!-- NODE: asignaciones -->
