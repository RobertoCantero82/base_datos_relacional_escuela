  <rect x="419" y="384" width="118" height="36" rx="6" fill="#ffffff" fill-opacity=".88" stroke="#B8D8F5" stroke-width=".8"/>
  <rect x="419" y="384" width="118" height="14" rx="6" fill="#2E6DB4"/>
  <rect x="419" y="391" width="118" height="7"  fill="#2E6DB4"/>
