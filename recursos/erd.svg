<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460">
<defs><style>
  @keyframes pulse  { 0%,100%{opacity:.15;r:28} 50%{opacity:.5;r:38} }
  @keyframes pulse2 { 0%,100%{opacity:.07;r:42} 50%{opacity:.22;r:54} }
  @keyframes f0 { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-5px)} }
  @keyframes f1 { 0%,100%{transform:translateY(-3px)} 50%{transform:translateY(3px)} }
  .r1{animation:pulse  3s ease-in-out infinite}
  .r2{animation:pulse2 3s ease-in-out infinite}
  .n0{animation:f0 4.2s ease-in-out infinite}
  .n1{animation:f1 4.6s ease-in-out infinite .3s}
  .n2{animation:f0 3.9s ease-in-out infinite .6s}
  .n3{animation:f1 4.4s ease-in-out infinite .2s}
  .n4{animation:f0 4.8s ease-in-out infinite .5s}
  .n5{animation:f1 4.0s ease-in-out infinite .8s}
  .n6{animation:f0 4.5s ease-in-out infinite .1s}
  .n7{animation:f1 3.8s ease-in-out infinite .4s}
  .n8{animation:f0 4.1s ease-in-out infinite .7s}
  .n9{animation:f1 4.3s ease-in-out infinite .9s}
  @keyframes t0{0%{offset-distance:0%}  100%{offset-distance:100%}}
  @keyframes t1{0%{offset-distance:12%} 100%{offset-distance:112%}}
  @keyframes t2{0%{offset-distance:24%} 100%{offset-distance:124%}}
  @keyframes t3{0%{offset-distance:36%} 100%{offset-distance:136%}}
  @keyframes t4{0%{offset-distance:48%} 100%{offset-distance:148%}}
  @keyframes t5{0%{offset-distance:60%} 100%{offset-distance:160%}}
  @keyframes t6{0%{offset-distance:72%} 100%{offset-distance:172%}}
  @keyframes t7{0%{offset-distance:84%} 100%{offset-distance:184%}}
  @keyframes t8{0%{offset-distance:6%}  100%{offset-distance:106%}}
  @keyframes t9{0%{offset-distance:54%} 100%{offset-distance:154%}}
  .d0{offset-path:path('M340,218 Q262,172 205,148');animation:t0 2.8s linear infinite}
  .d1{offset-path:path('M340,218 Q374,144 402,112');animation:t1 3.1s linear infinite}
  .d2{offset-path:path('M340,218 Q440,184 476,166');animation:t2 2.6s linear infinite}
  .d3{offset-path:path('M340,218 Q460,248 482,292');animation:t3 3.4s linear infinite}
  .d4{offset-path:path('M340,218 Q404,330 394,382');animation:t4 2.9s linear infinite}
  .d5{offset-path:path('M340,218 Q290,330 276,382');animation:t5 3.2s linear infinite}
  .d6{offset-path:path('M340,218 Q220,292 198,278');animation:t6 2.7s linear infinite}
  .d7{offset-path:path('M340,218 Q214,196 205,148');animation:t7 3.0s linear infinite}
  .d8{offset-path:path('M205,148 Q162,118 144,100');animation:t8 2.5s linear infinite}
  .d9{offset-path:path('M394,382 Q446,410 478,402');animation:t9 3.3s linear infinite}
  .edge{fill:none;stroke-width:.9}
  .hl{font:600 11px -apple-system,system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
  .sl{font:9.5px -apple-system,system-ui,sans-serif;fill:#6B8DAD;text-anchor:middle;dominant-baseline:central}
</style></defs>

<!-- fondo azul pastel -->
<rect width="680" height="460" fill="#D6E4F7"/>

<!-- círculos decorativos glassmorphism -->
<circle cx="-20" cy="-20" r="120" fill="#B8D8F5" opacity=".5"/>
<circle cx="720" cy="420" r="110" fill="#7BBCE8" opacity=".35"/>
<circle cx="660" cy="30"  r="80"  fill="#4A90D9" opacity=".18"/>
<circle cx="60"  cy="420" r="70"  fill="#B8D8F5" opacity=".4"/>

<!-- edges -->
<path class="edge" d="M340,218 Q262,172 205,148" stroke="#4A90D950"/>
<path class="edge" d="M340,218 Q374,144 402,112" stroke="#4A90D950"/>
<path class="edge" d="M340,218 Q440,184 476,166" stroke="#4A90D950"/>
<path class="edge" d="M340,218 Q460,248 482,292" stroke="#4A90D950"/>
<path class="edge" d="M340,218 Q404,330 394,382" stroke="#4A90D950"/>
<path class="edge" d="M340,218 Q290,330 276,382" stroke="#4A90D950"/>
<path class="edge" d="M340,218 Q220,292 198,278" stroke="#4A90D950"/>
<path class="edge" d="M340,218 Q214,196 205,148" stroke="#4A90D950"/>
<path class="edge" d="M205,148 Q162,118 144,100" stroke="#4A90D950"/>
<path class="edge" d="M394,382 Q446,410 478,402" stroke="#4A90D950"/>

<!-- dots viajeros -->
<circle class="d0" r="4" fill="#4A90D9cc"/>
<circle class="d1" r="4" fill="#2E6DB4cc"/>
<circle class="d2" r="4" fill="#4A90D9cc"/>
<circle class="d3" r="4" fill="#7BBCE8cc"/>
<circle class="d4" r="4" fill="#3A8C6Ecc"/>
<circle class="d5" r="4" fill="#4A90D9cc"/>
<circle class="d6" r="4" fill="#1E4A7Acc"/>
<circle class="d7" r="4" fill="#7BBCE8cc"/>
<circle class="d8" r="4" fill="#4A90D9cc"/>
<circle class="d9" r="4" fill="#2E6DB4cc"/>

<!-- pulso nodo central -->
<circle cx="340" cy="218" r="28" fill="none" stroke="#2E6DB4" class="r1"/>
<circle cx="340" cy="218" r="42" fill="none" stroke="#4A90D9" class="r2"/>

<!-- helper: tarjeta glass = rect blanco + borde azul claro -->

<!-- CENTRO: promociones -->
<g class="n0">
  <rect x="281" y="200" width="118" height="36" rx="6" fill="#ffffff" fill-opacity=".88" stroke="#B8D8F5" stroke-width=".8"/>
  <rect x="281" y="200" width="118" height="14" rx="6" fill="#2E6DB4"/>
  <rect x="281" y="207" width="118" height="7"  fill="#2E6DB4"/>
  <text class="hl" x="340" y="208">promociones</text>
