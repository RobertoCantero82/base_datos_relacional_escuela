  <rect x="143" y="263" width="118" height="34" rx="8" fill="#fff" stroke="#ddd" stroke-width=".5"/>
  <rect x="143" y="263" width="118" height="15" rx="8" fill="#534AB7"/>
  <rect x="143" y="270" width="118" height="8"  fill="#534AB7"/>
